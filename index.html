<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>光亮 · 龙虎灯</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2a0f2e;}
  body{
    background:#2a0f2e url(assets/bg_pattern.jpg?v=5) center/cover no-repeat;
    font-family:"Heiti SC","STHeiti","SimHei","Source Han Sans SC","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  body::before{content:"";position:fixed;inset:0;background:rgba(40,8,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #game{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  #game canvas{touch-action:none;box-shadow:0 0 60px rgba(0,0,0,.55);}
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#ff9cd4 url(assets/bg_pattern.jpg?v=5) center/cover;color:#fff;text-align:center;}
  #rotate .card{background:#004dfc;border:6px solid #ff00c8;border-radius:24px;padding:28px 34px;box-shadow:0 10px 0 #9a0078;}
  #rotate .phone{width:54px;height:92px;border:5px solid #fbf5a2;border-radius:12px;margin:0 auto 18px;animation:rot 2.2s ease-in-out infinite;}
  #rotate h2{margin:0 0 8px;font-size:26px;letter-spacing:.2em;color:#fbf5a2;}
  #rotate p{margin:0;font-size:15px;letter-spacing:.1em;}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fbf5a2;font-size:20px;letter-spacing:.3em;z-index:5;pointer-events:none;}
</style>
</head>
<body>
<div id="loading">龙虎灯 · 载入中</div>
<div id="game"></div>
<div id="rotate"><div class="card"><div class="phone"></div><h2>请横屏体验</h2><p>旋转手机后自动继续，进度不会丢失</p></div></div>
<script src="lib/phaser.min.js"></script>
<script src="js/core.js?v=9"></script>
<script src="js/data.js?v=9"></script>
<script src="js/scenes/boot.js?v=9"></script>
<script src="js/scenes/title.js?v=9"></script>
<script src="js/scenes/story.js?v=9"></script>
<script src="js/scenes/act.js?v=9"></script>
<script src="js/scenes/rescue.js?v=9"></script>
<script src="js/scenes/forage.js?v=9"></script>
<script src="js/scenes/medicine.js?v=9"></script>
<script src="js/scenes/market.js?v=9"></script>
<script src="js/scenes/craft.js?v=9"></script>
<script src="js/scenes/defense.js?v=9"></script>
<script src="js/scenes/decorate.js?v=9"></script>
<script src="js/scenes/ending.js?v=9"></script>
<script src="js/main.js?v=9"></script>
</body>
</html>
